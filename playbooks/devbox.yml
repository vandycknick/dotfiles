---
- name: Provision the devbox systemd-nspawn environment
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    devbox_name: devbox
    devbox_rebuild: false

    devbox_image_name: devbox-arch
    devbox_image_path: "/var/lib/machines/{{ devbox_image_name }}"
    devbox_machine_path: "/var/lib/machines/{{ devbox_name }}"
    devbox_mkosi_directory: "/etc/mkosi/{{ devbox_name }}"
    devbox_arch_mirror: https://geo.mirror.pkgbuild.com
    devbox_dns_probe: geo.mirror.pkgbuild.com
    devbox_required_image_packages:
      - archlinux-keyring
      - base
      - sudo
      - git
      - openssh
      - gnupg
    devbox_required_host_packages:
      - gnupg
      - mkosi
      - openssh
      - socat
      - sudo
    devbox_root_machine_argv:
      - /usr/bin/systemd-run
      - --quiet
      - --wait
      - --pipe
      - --collect
      - "--machine={{ devbox_name }}"
      - --uid=root

    devbox_gpg_fingerprint: 59C1F0F1B11413BC59FFDF68E742877FB4B706FC
    devbox_gpg_public_key_url: >-
      https://keys.openpgp.org/vks/v1/by-fingerprint/59C1F0F1B11413BC59FFDF68E742877FB4B706FC
    devbox_gpg_key_file: "/var/cache/{{ devbox_name }}/public-key.asc"

  pre_tasks:
    - name: Require an Arch Linux host
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Archlinux'
        fail_msg: This playbook currently supports Arch Linux hosts only.

    - name: Inspect the host KVM device
      ansible.builtin.stat:
        path: /dev/kvm
      register: devbox_host_kvm_device

    - name: Require host KVM support
      ansible.builtin.assert:
        that:
          - devbox_host_kvm_device.stat.exists
          - devbox_host_kvm_device.stat.ischr | default(false)
          - devbox_host_kvm_device.stat.gid is defined
        fail_msg: >-
          /dev/kvm must be available as a character device on the host before
          provisioning the devbox.

    - name: Look up the invoking user ID
      ansible.builtin.command:
        argv:
          - /usr/bin/id
          - --user
      become: false
      register: devbox_invoking_uid
      changed_when: false

    - name: Look up the invoking account
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - passwd
          - "{{ devbox_invoking_uid.stdout | trim }}"
      register: devbox_invoking_passwd
      changed_when: false

    - name: Validate the invoking account
      ansible.builtin.assert:
        that:
          - devbox_invoking_uid.stdout | trim is match('^[0-9]+$')
          - devbox_invoking_uid.stdout | int > 0
          - devbox_invoking_passwd.stdout.split(':') | length >= 7
          - >-
            devbox_invoking_passwd.stdout.split(':')[2] | int ==
            devbox_invoking_uid.stdout | int
          - devbox_invoking_passwd.stdout.split(':')[0] != 'root'
          - devbox_invoking_passwd.stdout.split(':')[5] is match('^/')
        fail_msg: >-
          Run this playbook as the non-root account that should own the devbox;
          let Ansible handle privilege escalation.

    - name: Look up the invoking user's primary group
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - group
          - "{{ devbox_invoking_passwd.stdout.split(':')[3] }}"
      register: devbox_invoking_group
      changed_when: false

    - name: Validate the invoking user's primary group
      ansible.builtin.assert:
        that:
          - devbox_invoking_group.stdout.split(':') | length >= 4
          - >-
            devbox_invoking_group.stdout.split(':')[2] | int ==
            devbox_invoking_passwd.stdout.split(':')[3] | int
        fail_msg: Unable to resolve the invoking user's primary group.

    - name: Record the devbox account
      ansible.builtin.set_fact:
        devbox_user: "{{ devbox_invoking_passwd.stdout.split(':')[0] }}"
        devbox_uid: "{{ devbox_invoking_passwd.stdout.split(':')[2] | int }}"
        devbox_gid: "{{ devbox_invoking_passwd.stdout.split(':')[3] | int }}"
        devbox_group: "{{ devbox_invoking_group.stdout.split(':')[0] }}"
        devbox_home: "{{ devbox_invoking_passwd.stdout.split(':')[5] }}"
        devbox_gnupg_home: >-
          {{ devbox_invoking_passwd.stdout.split(':')[5] }}/.local/share/gnupg

  tasks:
    - name: Install host dependencies
      ansible.builtin.package:
        name: "{{ devbox_required_host_packages }}"
        state: present

    - name: Create user SSH directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ devbox_user }}"
        group: "{{ devbox_group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ devbox_home }}/.ssh"
          mode: "0700"
        - path: "{{ devbox_home }}/.ssh/forwarded"
          mode: "0700"

    - name: Create the user GnuPG directory
      ansible.builtin.file:
        path: "{{ devbox_gnupg_home }}"
        state: directory
        owner: "{{ devbox_user }}"
        group: "{{ devbox_group }}"
        mode: "0700"

    - name: Remove the legacy GPG agent startup override
      ansible.builtin.lineinfile:
        path: "{{ devbox_home }}/.gnupg/gpg.conf"
        line: no-autostart
        state: absent

    - name: Remove the legacy forwarded GPG agent socket
      ansible.builtin.file:
        path: "{{ devbox_home }}/.gnupg/S.gpg-agent"
        state: absent

    - name: Create the public-key cache directory
      ansible.builtin.file:
        path: "{{ devbox_gpg_key_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the public GPG key
      ansible.builtin.get_url:
        url: "{{ devbox_gpg_public_key_url }}"
        dest: "{{ devbox_gpg_key_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Inspect the downloaded public GPG key
      ansible.builtin.command:
        argv:
          - /usr/bin/gpg
          - --batch
          - --show-keys
          - --with-colons
          - "{{ devbox_gpg_key_file }}"
      register: devbox_gpg_key_inspection
      changed_when: false

    - name: Validate the downloaded public GPG key
      ansible.builtin.assert:
        that:
          - >-
            ('fpr:::::::::' ~ devbox_gpg_fingerprint ~ ':') in
            devbox_gpg_key_inspection.stdout
          - devbox_gpg_key_inspection.stdout is regex('(?m)^uid:')
        fail_msg: >-
          The downloaded key must contain the expected fingerprint and at least
          one verified UID.

    - name: Import or refresh the public GPG key
      ansible.builtin.command:
        argv:
          - /usr/bin/gpg
          - --batch
          - --homedir
          - "{{ devbox_gnupg_home }}"
          - --import
          - "{{ devbox_gpg_key_file }}"
      become: true
      become_user: "{{ devbox_user }}"
      register: devbox_gpg_key_import
      changed_when: "'not changed' not in devbox_gpg_key_import.stderr"

    - name: Create the mkosi project directory
      ansible.builtin.file:
        path: "{{ devbox_mkosi_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the mkosi image definition
      ansible.builtin.template:
        src: devbox/mkosi.conf.j2
        dest: "{{ devbox_mkosi_directory }}/mkosi.conf"
        owner: root
        group: root
        mode: "0644"
      register: devbox_mkosi_definition

    - name: Validate the mkosi image definition
      ansible.builtin.command:
        argv:
          - /usr/bin/mkosi
          - --directory
          - "{{ devbox_mkosi_directory }}"
          - summary
      changed_when: false

    - name: Check for an existing devbox image
      ansible.builtin.stat:
        path: "{{ devbox_image_path }}"
      register: devbox_image_before_build

    - name: Check required packages in the existing image
      ansible.builtin.command:
        argv:
          - /usr/bin/pacman
          - --root
          - "{{ devbox_image_path }}"
          - --query
          - "{{ item }}"
      loop: "{{ devbox_required_image_packages }}"
      register: devbox_existing_image_packages
      changed_when: false
      failed_when: false
      when:
        - devbox_image_before_build.stat.exists
        - not (devbox_rebuild | bool)

    - name: Require a rebuild when the existing image lacks packages
      ansible.builtin.assert:
        that:
          - >-
            devbox_existing_image_packages.results
            | selectattr('rc', 'ne', 0)
            | list
            | length == 0
        fail_msg: >-
          The existing image lacks required packages. Re-run with
          -e devbox_rebuild=true to replace it.
      when:
        - devbox_image_before_build.stat.exists
        - not (devbox_rebuild | bool)

    - name: Stop the devbox before replacing its image
      ansible.builtin.systemd_service:
        name: "systemd-nspawn@{{ devbox_name }}.service"
        state: stopped
      when:
        - devbox_image_before_build.stat.exists
        - devbox_rebuild | bool

    - name: Build the devbox image
      ansible.builtin.command:
        argv:
          - /usr/bin/mkosi
          - --directory
          - "{{ devbox_mkosi_directory }}"
          - --force
          - build
      register: devbox_image_build
      changed_when: true
      when:
        - not ansible_check_mode
        - not devbox_image_before_build.stat.exists or devbox_rebuild | bool

    - name: Recheck the devbox image
      ansible.builtin.stat:
        path: "{{ devbox_image_path }}"
      register: devbox_image_after_build

    - name: Require a usable devbox image
      ansible.builtin.assert:
        that:
          - devbox_image_after_build.stat.isdir | default(false)
        fail_msg: mkosi did not produce the expected directory image.
      when: not ansible_check_mode

    - name: Read the container group database
      ansible.builtin.slurp:
        path: "{{ devbox_image_path }}/etc/group"
      register: devbox_container_group_database
      when: devbox_image_after_build.stat.exists

    - name: Locate the container KVM group
      ansible.builtin.set_fact:
        devbox_container_kvm_group_entries: >-
          {{ (devbox_container_group_database.content | b64decode).splitlines()
             | select('match', '^kvm:[^:]*:[0-9]+:')
             | list }}
      when: devbox_image_after_build.stat.exists

    - name: Require a container KVM group
      ansible.builtin.assert:
        that:
          - devbox_container_kvm_group_entries | length == 1
        fail_msg: The devbox image must contain exactly one kvm group.
      when: devbox_image_after_build.stat.exists

    - name: Locate container groups using the host KVM group ID
      ansible.builtin.set_fact:
        devbox_container_host_kvm_gid_entries: >-
          {{ (devbox_container_group_database.content | b64decode).splitlines()
             | select(
                 'match',
                 '^[^:]+:[^:]*:' ~
                 (devbox_host_kvm_device.stat.gid | string) ~ ':')
             | list }}
      when: devbox_image_after_build.stat.exists

    - name: Require the host KVM group ID to be available in the container
      ansible.builtin.assert:
        that:
          - >-
            devbox_container_host_kvm_gid_entries
            | reject('match', '^kvm:')
            | list
            | length == 0
        fail_msg: >-
          The host /dev/kvm group ID is already assigned to a different group
          in the devbox image and cannot be assigned safely to kvm.
      when: devbox_image_after_build.stat.exists

    - name: Align the container KVM group ID with the host device
      ansible.builtin.command:
        argv:
          - /usr/bin/groupmod
          - --root
          - "{{ devbox_image_path }}"
          - --gid
          - "{{ devbox_host_kvm_device.stat.gid }}"
          - kvm
      changed_when: true
      when:
        - devbox_image_after_build.stat.exists
        - not ansible_check_mode
        - >-
          devbox_container_kvm_group_entries[0].split(':')[2] | int !=
          devbox_host_kvm_device.stat.gid | int

    - name: Re-read the container group database
      ansible.builtin.slurp:
        path: "{{ devbox_image_path }}/etc/group"
      register: devbox_reconciled_group_database
      when:
        - devbox_image_after_build.stat.exists
        - not ansible_check_mode

    - name: Record the reconciled container KVM group
      ansible.builtin.set_fact:
        devbox_reconciled_kvm_group_entries: >-
          {{ (devbox_reconciled_group_database.content | b64decode).splitlines()
             | select('match', '^kvm:[^:]*:[0-9]+:')
             | list }}
      when:
        - devbox_image_after_build.stat.exists
        - not ansible_check_mode

    - name: Require matching host and container KVM group IDs
      ansible.builtin.assert:
        that:
          - devbox_reconciled_kvm_group_entries | length == 1
          - >-
            devbox_reconciled_kvm_group_entries[0].split(':')[2] | int ==
            devbox_host_kvm_device.stat.gid | int
        fail_msg: >-
          The host /dev/kvm group ID does not match the devbox kvm group ID.
          Device permissions require identical numeric IDs because the
          container uses PrivateUsers=no.
      when:
        - devbox_image_after_build.stat.exists
        - not ansible_check_mode

    - name: Explain a deferred mkosi definition change
      ansible.builtin.debug:
        msg: >-
          The mkosi definition changed, but the existing image was preserved.
          Re-run with -e devbox_rebuild=true when you want to replace it.
      when:
        - devbox_mkosi_definition.changed
        - devbox_image_before_build.stat.exists
        - not (devbox_rebuild | bool)

    - name: Point the machine name at the immutable image name
      ansible.builtin.file:
        src: "{{ devbox_image_name }}"
        dest: "{{ devbox_machine_path }}"
        state: link
        force: true
      when: devbox_image_after_build.stat.exists

    - name: Create managed directories inside the image
      ansible.builtin.file:
        path: "{{ devbox_image_path }}{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/pacman.d
        - /etc/sudoers.d
        - /etc/sysusers.d
        - /usr/local/libexec
      when: devbox_image_after_build.stat.exists

    - name: Install the container pacman mirrorlist
      ansible.builtin.template:
        src: devbox/pacman-mirrorlist.j2
        dest: "{{ devbox_image_path }}/etc/pacman.d/mirrorlist"
        owner: root
        group: root
        mode: "0644"
      when: devbox_image_after_build.stat.exists

    - name: Link the container resolver to systemd-resolved
      ansible.builtin.file:
        src: ../run/systemd/resolve/stub-resolv.conf
        dest: "{{ devbox_image_path }}/etc/resolv.conf"
        state: link
        owner: root
        group: root
        force: true
        follow: false
      register: devbox_container_resolv_conf
      when: devbox_image_after_build.stat.exists

    - name: Install the container account definition
      ansible.builtin.template:
        src: devbox/devbox.sysusers.j2
        dest: "{{ devbox_image_path }}/etc/sysusers.d/devbox.conf"
        owner: root
        group: root
        mode: "0644"
      register: devbox_container_account_definition
      when: devbox_image_after_build.stat.exists

    - name: Reconcile accounts inside the image
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-sysusers
          - "--root={{ devbox_image_path }}"
      register: devbox_container_accounts
      changed_when: >-
        'Creating' in (devbox_container_accounts.stdout ~ devbox_container_accounts.stderr)
      when: devbox_image_after_build.stat.exists

    - name: Install passwordless sudo inside the container
      ansible.builtin.template:
        src: devbox/container-sudoers.j2
        dest: "{{ devbox_image_path }}/etc/sudoers.d/devbox"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/bin/visudo -cf %s"
      when: devbox_image_after_build.stat.exists

    - name: Install the container session helper
      ansible.builtin.template:
        src: devbox/enter-devbox-session.j2
        dest: "{{ devbox_image_path }}/usr/local/libexec/enter-devbox-session"
        owner: root
        group: root
        mode: "0755"
        validate: "/usr/bin/bash -n %s"
      register: devbox_container_session_helper
      when: devbox_image_after_build.stat.exists

    - name: Remove container SSH policy inherited from the host design
      ansible.builtin.file:
        path: "{{ devbox_image_path }}/etc/ssh/sshd_config.d/90-devbox.conf"
        state: absent
      when: devbox_image_after_build.stat.exists

    - name: Disable the inner SSH daemon
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - "--root={{ devbox_image_path }}"
          - disable
          - sshd.service
      register: devbox_inner_sshd_disable
      changed_when: >-
        'Removed' in (devbox_inner_sshd_disable.stdout ~ devbox_inner_sshd_disable.stderr)
      failed_when: devbox_inner_sshd_disable.rc not in [0, 1]
      when: devbox_image_after_build.stat.exists

    - name: Create host integration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/ssh/sshd_config.d
        - /etc/systemd/nspawn
        - /etc/sudoers.d
        - /usr/local/libexec

    - name: Install the nspawn configuration
      ansible.builtin.template:
        src: devbox/devbox.nspawn.j2
        dest: "/etc/systemd/nspawn/{{ devbox_name }}.nspawn"
        owner: root
        group: root
        mode: "0644"
      register: devbox_nspawn_configuration

    - name: Create the nspawn service override directory
      ansible.builtin.file:
        path: "/etc/systemd/system/systemd-nspawn@{{ devbox_name }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the nspawn service override
      ansible.builtin.template:
        src: devbox/nspawn-override.conf.j2
        dest: >-
          /etc/systemd/system/systemd-nspawn@{{ devbox_name }}.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
      register: devbox_nspawn_service_override

    - name: Install the root-owned container launcher
      ansible.builtin.template:
        src: devbox/run-devbox-session.j2
        dest: /usr/local/libexec/run-devbox-session
        owner: root
        group: root
        mode: "0755"
        validate: "/usr/bin/bash -n %s"

    - name: Install the forced-command wrapper
      ansible.builtin.template:
        src: devbox/enter-devbox.j2
        dest: /usr/local/libexec/enter-devbox
        owner: root
        group: root
        mode: "0755"
        validate: "/usr/bin/bash -n %s"

    - name: Authorize only the root-owned launcher through sudo
      ansible.builtin.template:
        src: devbox/host-sudoers.j2
        dest: /etc/sudoers.d/devbox-login
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/bin/visudo -cf %s"

    - name: Install the host GPG forwarding policy
      ansible.builtin.template:
        src: devbox/gpg-agent-forwarding.conf.j2
        dest: /etc/ssh/sshd_config.d/40-gpg-agent-forwarding.conf
        owner: root
        group: root
        mode: "0644"
      register: devbox_gpg_sshd_policy

    - name: Install the forced devbox login policy
      ansible.builtin.template:
        src: devbox/devbox-sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/90-devbox.conf
        owner: root
        group: root
        mode: "0644"
      register: devbox_login_sshd_policy

    - name: Validate the complete SSH daemon configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/sshd
          - -t
      changed_when: false

    - name: Start and enable the devbox machine
      ansible.builtin.systemd_service:
        name: "systemd-nspawn@{{ devbox_name }}.service"
        daemon_reload: true
        enabled: true
        state: >-
          {{ 'restarted'
             if (devbox_nspawn_configuration.changed or
                 devbox_nspawn_service_override.changed or
                 devbox_image_build.changed | default(false) or
                 devbox_container_resolv_conf.changed | default(false) or
                 devbox_container_session_helper.changed | default(false))
             else 'started' }}
      when: devbox_image_after_build.stat.exists

    - name: Verify that the machine service is active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - "systemd-nspawn@{{ devbox_name }}.service"
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Inspect the container resolver link
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['/usr/bin/readlink', '--canonicalize', '/etc/resolv.conf'] }}
      register: devbox_container_resolv_conf_target
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Require the systemd-resolved stub resolver
      ansible.builtin.assert:
        that:
          - >-
            devbox_container_resolv_conf_target.stdout | trim ==
            '/run/systemd/resolve/stub-resolv.conf'
        fail_msg: The container does not use the systemd-resolved DNS stub.
      when: devbox_image_after_build.stat.exists

    - name: Verify container DNS resolution
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['/usr/bin/resolvectl', 'query', devbox_dns_probe] }}
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Initialize the container pacman keyring
      ansible.builtin.command:
        argv: "{{ devbox_root_machine_argv + ['/usr/bin/pacman-key', '--init'] }}"
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Populate the container pacman keyring
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['/usr/bin/pacman-key', '--populate', 'archlinux'] }}
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Update the container Arch keyring package
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['--setenv=LC_ALL=C', '/usr/bin/pacman', '--sync', '--refresh',
              '--needed', '--noconfirm', 'archlinux-keyring'] }}
      register: devbox_keyring_update
      changed_when: >-
        'there is nothing to do' not in
        ((devbox_keyring_update.stdout ~ devbox_keyring_update.stderr) | lower)
      when: devbox_image_after_build.stat.exists

    - name: Repopulate the updated container pacman keyring
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['/usr/bin/pacman-key', '--populate', 'archlinux'] }}
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Upgrade all container packages
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv +
             ['--setenv=LC_ALL=C', '/usr/bin/pacman', '--sync', '--sysupgrade',
              '--noconfirm'] }}
      register: devbox_package_upgrade
      changed_when: >-
        'there is nothing to do' not in
        ((devbox_package_upgrade.stdout ~ devbox_package_upgrade.stderr) | lower)
      when: devbox_image_after_build.stat.exists

    - name: Restart the devbox after package upgrades
      ansible.builtin.systemd_service:
        name: "systemd-nspawn@{{ devbox_name }}.service"
        state: restarted
      when:
        - devbox_image_after_build.stat.exists
        - devbox_package_upgrade.changed

    - name: Verify the container account
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --quiet
          - --wait
          - --pipe
          - --collect
          - "--machine={{ devbox_name }}"
          - /usr/bin/id
          - --user
          - "{{ devbox_user }}"
      register: devbox_container_uid
      changed_when: false
      retries: 30
      delay: 1
      until: devbox_container_uid.rc == 0
      when: devbox_image_after_build.stat.exists

    - name: Require matching host and container UIDs
      ansible.builtin.assert:
        that:
          - devbox_container_uid.stdout | trim == devbox_uid | string
      when: devbox_image_after_build.stat.exists

    - name: Verify that KVM is exposed inside the container
      ansible.builtin.command:
        argv: >-
          {{ devbox_root_machine_argv + ['/usr/bin/test', '-c', '/dev/kvm'] }}
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Verify devbox account access to KVM
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --quiet
          - --wait
          - --pipe
          - --collect
          - "--machine={{ devbox_name }}"
          - "--uid={{ devbox_user }}"
          - /usr/bin/test
          - "{{ item }}"
          - /dev/kvm
      loop:
        - -r
        - -w
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Inspect the container core repository server
      ansible.builtin.command:
        argv:
          - /usr/bin/systemd-run
          - --quiet
          - --wait
          - --pipe
          - --collect
          - "--machine={{ devbox_name }}"
          - /usr/bin/pacman-conf
          - --repo
          - core
          - Server
      register: devbox_container_core_server
      changed_when: false
      when: devbox_image_after_build.stat.exists

    - name: Require a configured container package mirror
      ansible.builtin.assert:
        that:
          - devbox_container_core_server.stdout | trim | length > 0
          - devbox_arch_mirror in devbox_container_core_server.stdout
        fail_msg: The container core repository does not use the configured Arch mirror.
      when: devbox_image_after_build.stat.exists

    - name: Reload SSH after policy changes
      ansible.builtin.systemd_service:
        name: sshd.service
        state: reloaded
      when: devbox_gpg_sshd_policy.changed or devbox_login_sshd_policy.changed

# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Under config-version 1 these were inferred from the workspace bindings.
# Version 2 defaults to an empty list, so they are stated explicitly.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 20

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[workspace-to-monitor-force-assignment]
# Every workspace is pinned so it cannot drift to whichever monitor happened to
# be focused. Patterns are most-specific first and end in 'built-in' so a
# laptop-only setup still resolves. 'built-in' rather than 'main' because 'main'
# tracks the menu bar monitor, not the laptop.
1 = ['PL2730H', 'DELL U3223QE', 'DELL U3225QE', 'built-in']
2 = ['PL2730H', 'DELL U3223QE', 'DELL U3225QE', 'built-in']
3 = ['PLE2482H', 'built-in']
4 = 'built-in'
5 = 'built-in'
6 = 'built-in'
7 = 'built-in'
8 = 'built-in'
9 = 'built-in'


# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 5
inner.vertical =   5
outer.left =       5
outer.bottom =     5
outer.top =        5
outer.right =      5

[mode.main.binding]
# cmd-t = 'exec-and-forget open -n /Applications/Alacritty.app'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-f = 'fullscreen'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

alt-shift-c = 'reload-config'

alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# NOTE: Keep this map in sync with the on-window-detected rules below. It is a
# comment, so nothing validates it. Update it in the same edit whenever a rule
# is added, removed, or retargeted.
#
# workspace 1: Ghostty
# workspace 2: Zen
# workspace 3: Slack
# workspace 4: Calendar, Mail, Reminders
# workspace 5: Notion, Linear, Fizzy
# workspace 6: Proton Pass, 1Password
# workspace 7: (free)
# workspace 8: Zoom
# workspace 9: Spotify
[[on-window-detected]]
  if.app-id = 'com.mitchellh.ghostty'
  run = 'move-node-to-workspace 1'

[[on-window-detected]]
  if.app-id = 'app.zen-browser.zen'
  run = 'move-node-to-workspace 2'

[[on-window-detected]]
  if.app-id = 'com.tinyspeck.slackmacgap'
  run = 'move-node-to-workspace 3'

[[on-window-detected]]
  if.app-id = 'com.apple.iCal'
  run = 'move-node-to-workspace 4'

[[on-window-detected]]
  if.app-id = 'com.apple.mail'
  run = 'move-node-to-workspace 4'

[[on-window-detected]]
  if.app-id = 'com.apple.reminders'
  run = 'move-node-to-workspace 4'

[[on-window-detected]]
  if.app-id = 'notion.id'
  run = 'move-node-to-workspace 5'

[[on-window-detected]]
  if.app-id = 'com.linear'
  run = 'move-node-to-workspace 5'

# Safari web app. Matched by name because its bundle id carries a UUID that
# changes whenever the web app is recreated.
[[on-window-detected]]
  if.app-name-regex-substring = '^Fizzy$'
  run = 'move-node-to-workspace 5'

[[on-window-detected]]
  if.app-id = 'me.proton.pass.electron'
  run = 'move-node-to-workspace 6'

[[on-window-detected]]
  if.app-id = 'com.1password.1password'
  run = 'move-node-to-workspace 6'

[[on-window-detected]]
  if.app-id = 'us.zoom.xos'
  run = 'move-node-to-workspace 8'

[[on-window-detected]]
  if.app-id = 'com.spotify.client'
  run = 'move-node-to-workspace 9'
